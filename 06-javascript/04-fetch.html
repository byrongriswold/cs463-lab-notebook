<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Exercise 04 - Fetch</title>
    <link rel="stylesheet" href="04-fetch.css" />
    <script defer src="04-fetch.js"></script>

  <body>
    <main>
      <nav class="navbar">
